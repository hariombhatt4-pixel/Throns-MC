<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Throns MC - Store</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="min-h-screen flex flex-col">
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
        <div class="bg-[#1a1a1e] rounded-lg p-8 text-center border-2 border-[#2d2d34] mc-border">
            <h1 class="text-4xl font-extrabold text-white mb-4">Welcome to Throns MC</h1>
            <p class="text-gray-400 max-w-2xl mx-auto mb-6">Explore our standalone store tabs to claim rewards. All transactions are backed manually by staff via Discord tickets.</p>
            <div class="flex justify-center gap-4">
                <a href="/ranks" class="bg-amber-500 text-black font-bold px-6 py-3 rounded uppercase tracking-wider hover:bg-amber-400">Browse Ranks</a>
                <a href="https://discord.gg" target="_blank" class="bg-[#5865F2] text-white font-bold px-6 py-3 rounded uppercase tracking-wider flex items-center gap-2"><i class="fa-brands fa-discord"></i> Open Ticket</a>
            </div>
        </div>
    </main>
    <script src="/navbar.js"></script>
</body>
</html>
