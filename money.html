<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Throns MC - Money</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com"><link rel="stylesheet" href="/styles.css">
</head>
<body class="min-h-screen flex flex-col">
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8 space-y-6">
        <h2 class="text-2xl font-bold border-l-4 border-emerald-500 pl-3 text-white uppercase">Economy Packs</h2>
        <div id="money-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>
    <script src="/navbar.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('money-container');
            const items = storeData.filter(i => i.category === 'money');
            if(!items.length) { container.innerHTML = `<p class="text-gray-500">No ingame money variables loaded.</p>`; return; }
            container.innerHTML = items.map(item => `
                <div class="bg-[#1a1a1e] rounded-lg p-5 border-2 border-emerald-500/40 flex flex-col justify-between">
                    <div>
                        <h3 class="text-xl font-bold text-white mb-1 uppercase">${item.title}</h3>
                        <div class="text-2xl font-black text-emerald-400 mb-4">${item.price}</div>
                        <ul class="space-y-2 mb-6">${item.perks.map(p => `<li class="text-xs text-gray-400"><i class="fa-solid fa-coins text-emerald-500 mr-2"></i>\${p}</li>`).join('')}</ul>
                    </div>
                    <a href="https://discord.gg" target="_blank" class="w-full text-center py-2 rounded text-sm font-bold uppercase bg-emerald-600 text-white">Purchase Money</a>
                </div>`).join('');
        });
    </script>
</body>
</html>
