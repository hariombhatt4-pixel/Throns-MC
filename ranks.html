<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Throns MC - Ranks</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com"><link rel="stylesheet" href="/styles.css">
</head>
<body class="min-h-screen flex flex-col">
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8 space-y-6">
        <h2 class="text-2xl font-bold border-l-4 border-amber-500 pl-3 text-white uppercase">Server Ranks</h2>
        <div id="ranks-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>
    <script src="/navbar.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('ranks-container');
            const items = storeData.filter(i => i.category === 'ranks');
            
            if(!items.length) { container.innerHTML = `<p class="text-gray-500">No ranks added yet.</p>`; return; }
            
            container.innerHTML = items.map(item => {
                let displayPrice = item.price;
                const numMatch = item.price.match(/\d+/);
                if (activeDiscountFactor > 0 && numMatch) {
                    displayPrice = Math.round(parseInt(numMatch) * (1 - activeDiscountFactor)) + " rs (LS35 Applied)";
                }
                return `
                    <div class="bg-[#1a1a1e] rounded-lg p-5 border-2 border-amber-500/40 flex flex-col justify-between">
                        <div>
                            <h3 class="text-xl font-bold text-white mb-1 uppercase">${item.title}</h3>
                            <div class="text-2xl font-black text-amber-400 mb-4">${displayPrice}</div>
                            <ul class="space-y-2 mb-6">${item.perks.map(p => `<li class="text-xs text-gray-400"><i class="fa-solid fa-check text-emerald-500 mr-2"></i>\${p}</li>`).join('')}</ul>
                        </div>
                        <a href="https://discord.gg" target="_blank" class="w-full text-center py-2 rounded text-sm font-bold uppercase bg-amber-500 text-black">Buy via Ticket</a>
                    </div>`;
            }).join('');
        });
    </script>
</body>
</html>
